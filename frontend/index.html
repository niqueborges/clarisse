<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarisse — Cadastro de Clientes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>🌿 Clarisse</h1>
        <p class="subtitulo">Sistema de cadastro de clientes</p>
    </header>

    <main>
        <section class="card" id="secao-formulario">
            <h2>Novo Cliente</h2>
            <div id="formulario">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Nome completo" minlength="5" maxlength="100">
                </div>
                <div class="campo">
                    <label for="dataNascimento">Data de nascimento</label>
                    <input type="date" id="dataNascimento">
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="(99)99999-9999">
                </div>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="exemplo@dominio.com">
                </div>
                <div id="mensagem-erro" class="erro hidden"></div>
                <div class="botoes">
                    <button id="btn-cadastrar" onclick="cadastrarCliente()">Cadastrar</button>
                    <button id="btn-limpar" class="secundario" onclick="limparFormulario()">Limpar</button>
                </div>
            </div>
        </section>

        <section class="card" id="secao-lista">
            <h2>Clientes Cadastrados</h2>
            <div id="lista-clientes">
                <p class="vazio">Nenhum cliente cadastrado ainda.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>🌿 Clarisse — projeto open source baseado no 
            <a href="https://github.com/niqueborges/CompassUol_PB_2024" target="_blank">
                CompassUOL PB 2024
            </a>
        </p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
